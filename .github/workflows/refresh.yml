name: Refresh highlights DB from Amazon

on:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 3am UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amazon-highlights-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Scrape Amazon
        env:
          AMAZON_EMAIL: ${{ secrets.AMAZON_EMAIL }}
          AMAZON_PASSWORD: ${{ secrets.AMAZON_PASSWORD }}
          AMAZON_OTP_SECRET: ${{ secrets.AMAZON_OTP_SECRET }}
        run: python refresh.py --scrape-output "$RUNNER_TEMP/amazon-highlights.json"

      - name: Merge and publish highlights against latest archive
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The incoming batch lives outside the checkout. Each retry merges it
          # into the newest archive and reapplies its deletion tombstones.
          # Only the archive is staged; the latest tombstone file is preserved.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$TARGET_BRANCH"
            git reset --hard FETCH_HEAD
            python refresh.py --merge-input "$RUNNER_TEMP/amazon-highlights.json"
            git add highlights.json
            if git diff --cached --quiet; then
              echo "No new highlights to commit."
              exit 0
            fi
            git commit -m "chore: refresh highlights from Amazon"
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              exit 0
            fi
            echo "Publish raced another writer or failed; retrying against latest archive ($attempt/5)."
            sleep "$attempt"
          done
          echo "Could not publish after 5 attempts; existing remote archive is unchanged by this run."
          exit 1

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "debug_*.png"
          retention-days: 3
